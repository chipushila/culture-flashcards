const mk=(r,o,n)=>r.split("\n").map((l,i)=>{const p=l.split("|");return{id:o+i,w:n?p[0]:+p[0],n:n,q:p[1],a:p[2],d:p[3].split(";"),e:p[4]||""}});
const O=mk(RAW,0,0),N=mk(RAW2,O.length,1),C=O.concat(N),TP=[...new Set(N.map(c=>c.w))];

const $=id=>document.getElementById(id),sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function filt(){const w=$("wk").value,s=$("st").value,g=$("sg").value;return C.filter(c=>(g=="all"||(g=="orig"&&!c.n)||(g=="new"&&c.n))&&(w=="0"||c.w==w)&&(s=="all"||(s=="new"&&!S.known[c.id])||(s=="hard"&&S.hard[c.id])))}
function build(){deck=filt();pos=0;flip=false;P=null;render()}
let bag=[];
function opts(c){if(!bag.length)bag=sh([0,1,2,3,0,1,2,3]);let p=bag.pop();const d=sh(c.d),o=[];for(let i=0;i<4;i++)o.push(i==p?c.a:d.pop());return o}
function render(){["t0","t1","t2"].forEach((t,i)=>$(t).className=i==tab?"on":"");$("flt").style.display=tab==2?"none":"flex";
 if(tab==2)return prog();

 tab==0?study():prac()}
function study(){const c=deck[pos];
 const o=c._o||(c._o=opts(c));
 $("v").innerHTML=`<div class="tag">Card ${pos+1} of ${deck.length}${S.known[c.id]?" · ✔ known":""}${S.hard[c.id]?" · ⚠ need practice":""}</div>
<div class="scene"><div class="card ${flip?"f":""}" id="cd"><div class="face"><div class="tag">${lab(c)}</div><div class="q">${c.q}</div>${o.map((x,i)=>`<div>${L[i]}) ${x}</div>`).join("")}<p class="tag">Tap the card to see the answer</p></div>
<div class="face back"><div class="tag">${lab(c)}</div><div class="q">${c.q}</div><div class="ans">${L[o.indexOf(c.a)]}) ${c.a}</div><div>${c.e}</div></div></div></div>
<div class="row"><button id="pv">← Previous</button><button id="sa">Show answer</button><button id="nx">Next →</button></div>
<div class="row"><button id="kn" class="p">I know this</button><button id="hd">Need more practice</button><button id="sf">Shuffle</button></div>`;
 $("cd").onclick=$("sa").onclick=()=>{flip=!flip;$("cd").classList.toggle("f",flip)};
 const go=d=>{pos=(pos+d+deck.length)%deck.length;flip=false;deck[pos]._o=null;study()};
 $("pv").onclick=()=>go(-1);$("nx").onclick=()=>go(1);
 $("kn").onclick=()=>{S.known[c.id]=1;delete S.hard[c.id];save();go(1)};
 $("hd").onclick=()=>{S.hard[c.id]=1;delete S.known[c.id];save();go(1)};
 $("sf").onclick=()=>{deck=sh(deck);pos=0;flip=false;study()}}
function prac(){
 if(!P)P={i:0,s:0,list:sh(deck),done:false,pick:null,o:null};
 if(P.i>=P.list.length){S.scores.push({d:new Date().toLocaleDateString(),s:P.s,n:P.list.length});save();
  $("v").innerHTML=`<div class="box"><div class="tag">Final result</div><div class="big">${P.s} / ${P.list.length}</div><p>${Math.round(100*P.s/P.list.length)}% correct</p><button class="p" id="rs">Restart</button></div>`;
  $("rs").onclick=()=>{P=null;prac()};return}
 const c=P.list[P.i];P.o=P.o||opts(c);
 $("v").innerHTML=`<div class="tag">Question ${P.i+1} of ${P.list.length} · Score ${P.s}</div><div class="box"><div class="tag">${lab(c)}</div><div class="q">${c.q}</div>
 ${P.o.map((x,i)=>{let cl="";if(P.pick!=null){if(x==c.a)cl="ok";else if(i==P.pick)cl="no"}return`<button class="opt ${cl}" data-i="${i}">${L[i]}) ${x}</button>`}).join("")}
 ${P.pick!=null?`<p><b>${P.o[P.pick]==c.a?"✔ Correct!":"✘ Not correct."}</b> Answer: ${c.a}. ${c.e}</p><button class="p" id="nq">${P.i+1<P.list.length?"Next question":"See result"}</button>`:""}</div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(P.pick!=null)return;P.pick=+b.dataset.i;
  if(P.o[P.pick]==c.a){P.s++;S.known[c.id]=1;delete S.hard[c.id]}else{S.hard[c.id]=1;delete S.known[c.id]}save();prac()});
 if($("nq"))$("nq").onclick=()=>{P.i++;P.pick=null;P.o=null;prac()}}
function prog(){const n=C.length,k=Object.keys(S.known).length,h=Object.keys(S.hard).length,pc=Math.round(100*k/n);
 $("v").innerHTML=`<div class="box"><div class="tag">Overall progress</div><div class="big">${pc}%</div><div class="bar"><i style="width:${pc}%"></i></div></div>

 <div class="box"><div class="tag">Practice scores</div>${S.scores.length?S.scores.slice(-10).reverse().map(x=>`<div>${x.d}: ${x.s} / ${x.n}</div>`).join(""):"No practice test yet."}</div>
 <button id="rp">Reset all progress</button>`;
 $("rp").onclick=()=>{if(confirm("Delete all progress?")){S={known:{},hard:{},scores:[]};save();prog()}}}
[0,1,2].forEach(i=>$("t"+i).onclick=()=>{tab=i;P=null;build()});

build();
